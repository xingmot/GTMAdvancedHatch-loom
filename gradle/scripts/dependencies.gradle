apply from: 'gradle/scripts/helpers.gradle'

dependencies {
    // kotlin-for-forge
    modApi("thedarkcolour:kotlinforforge:$project.kotlinforforge_version")
    include("thedarkcolour:kotlinforforge:$project.kotlinforforge_version")

    // 重要前置
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:$project.mixinextras_version"))
    implementation(include("io.github.llamalad7:mixinextras-forge:$project.mixinextras_version"))
    modImplementation("dev.architectury:architectury-forge:${project.architectury_version}")
    modImplementation("dev.toma.configuration:configuration-$project.minecraft_version:$project.configuration_version-forge") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:$project.registrate_version")

    // 辅助模组
    modCompileOnly("mezz.jei:jei-$project.minecraft_version-forge-api:$project.jei_version") { transitive = false }
    modCompileOnly("mezz.jei:jei-$project.minecraft_version-common-api:$project.jei_version") { transitive = false }
    modRuntimeOnly("mezz.jei:jei-$project.minecraft_version-forge:$project.jei_version") { transitive = false }
    modCompileOnly("dev.emi:emi-forge:$project.emi_version")
    modImplementation("dev.ftb.mods:ftb-library-forge:2001.2.4"){ transitive = false }
    modRuntimeOnly("dev.ftb.mods:ftb-chunks-forge:2001.3.1"){ transitive = false }
    modImplementation("dev.ftb.mods:ftb-teams-forge:2001.3.0"){ transitive = false }
    modRuntimeOnly("dev.ftb.mods:ftb-ultimine-forge:2001.1.5"){ transitive = false }
    modRuntimeOnly("maven.modrinth:modern-ui:3.12.0.1")

    // 纯客户端
    modRuntimeOnly("maven.modrinth:embeddium:0.3.30+mc1.20.1") // 没汉化无所谓，玩家会自己开i18n的（逃
    modRuntimeOnly("maven.modrinth:sodium-extras:forge-1.20.1-1.0.7")
    modRuntimeOnly("maven.modrinth:modern-ui:3.12.0.1")
    modRuntimeOnly("dev:jecharacters:1.20.1-forge-4.5.11-dev-shadow")

    // 强依赖
    modImplementation("com.gregtechceu.gtceu:gtceu-$project.minecraft_version:$project.gtceu_version:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-$project.minecraft_version:$project.ldlib_version") { transitive = false }
    modImplementation("maven.modrinth:gtmoremachine:mc$project.minecraft_version-$project.gtmm_version")
    modImplementation("maven.modrinth:patchouli:1.20.1-84.1-forge")
    include("maven.modrinth:patchouli:1.20.1-84.1-forge")
    // 联动模组
    modImplementation("dev.latvian.mods:rhino-forge:$project.rhino_version")
    modImplementation("dev.latvian.mods:kubejs-forge:$project.kubejs_version")
    modImplementation("maven.modrinth:jade:$project.jade_version")
    modImplementation("curse.maven:building-gadgets-298187:6850495") //1.0.8
    //   AE系列
    modRuntimeOnly("curse.maven:glodium-957920:5006780")
    modRuntimeOnly("org.appliedenergistics:guideme:$project.guideme_version")
    modImplementation("appeng:appliedenergistics2-forge:$project.ae2_version")
}

repositories {
    mavenCentral()
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.gtceu.com"
        content {
            includeGroup "com.gregtechceu.gtceu"
        }
    }
    maven {
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name = 'ModdingX Maven'
        url = 'https://maven.moddingx.org/'
    }
    maven {
        name = 'IzzelAliz Maven'
        url = 'https://maven.izzel.io/releases/'
    }
    maven {
        name = 'GuideME Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        content {
            includeModule('org.appliedenergistics', 'guideme')
        }
    }
    maven {
        url = "https://maven.ftb.dev/releases"
        content {
            includeGroup("dev.ftb.mods")
        }
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        url = "https://modmaven.dev"
    }
    maven {
        url = "https://maven.blamejared.com/"
    }
    maven { // terraformers - EMI
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }
    maven {
        url = "https://maven.firstdarkdev.xyz/snapshots/"
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        url = "https://maven.parchmentmc.org"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    flatDir {
        dir "gradle/libs"
    }
    mavenLocal() // Must be last for caching to work
}

shadowJar {
    archiveClassifier.set("dev-shadow")

    // here you can relocate packages, for example:
//    relocate("io.github.classgraph", "zzzank.probejs.shaded.classgraph")
    // User Guide from the Shadow plugin itself: https://gradleup.com/shadow/

    configurations = [project.configurations.shade]
}
